<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Stats - Let's Play</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #4ecdc4;
        }
        .stat-card .label {
            color: #888;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .player-list {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
        }
        .player-header {
            display: grid;
            grid-template-columns: 50px 1fr 100px 100px 120px;
            padding: 15px 20px;
            background: rgba(255,255,255,0.1);
            font-weight: bold;
            font-size: 0.9em;
            color: #888;
        }
        .player-row {
            display: grid;
            grid-template-columns: 50px 1fr 100px 100px 120px;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
        }
        .player-row:hover {
            background: rgba(255,255,255,0.05);
        }
        .player-row:last-child {
            border-bottom: none;
        }
        .rank {
            font-weight: bold;
            color: #888;
        }
        .rank.top1 { color: #ffd700; }
        .rank.top2 { color: #c0c0c0; }
        .rank.top3 { color: #cd7f32; }
        .name {
            font-weight: 500;
        }
        .plays {
            text-align: center;
            color: #4ecdc4;
            font-weight: bold;
        }
        .best-score {
            text-align: center;
            color: #ff6b6b;
        }
        .avg-score {
            text-align: center;
            color: #888;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }
        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        .date-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .date-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }
        .date-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .date-btn.active {
            background: #4ecdc4;
            color: #1a1a2e;
        }
        @media (max-width: 600px) {
            .player-header, .player-row {
                grid-template-columns: 40px 1fr 60px 60px;
                font-size: 0.85em;
            }
            .avg-score {
                display: none;
            }
            .stats-summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Player Stats</h1>
        <p class="subtitle">유저별 플레이 횟수 (2025-12-23)</p>

        <div class="stats-summary">
            <div class="stat-card">
                <div class="value" id="totalPlayers">-</div>
                <div class="label">총 플레이어</div>
            </div>
            <div class="stat-card">
                <div class="value" id="totalGames">-</div>
                <div class="label">총 게임 수</div>
            </div>
            <div class="stat-card">
                <div class="value" id="avgPlays">-</div>
                <div class="label">평균 플레이</div>
            </div>
        </div>

        <div class="player-list">
            <div class="player-header">
                <span>#</span>
                <span>이름</span>
                <span style="text-align:center">플레이</span>
                <span style="text-align:center">최고점</span>
                <span style="text-align:center">평균점</span>
            </div>
            <div id="playerList">
                <div class="loading">데이터 로딩중</div>
            </div>
        </div>
    </div>

    <script>
        let allScores = [];

        async function loadAllData() {
            try {
                const response = await fetch('./data/2025-12-23.csv');
                const text = await response.text();
                const lines = text.trim().split('\n').slice(1); // skip header
                allScores = lines.map(line => {
                    const lastComma = line.lastIndexOf(',');
                    return {
                        name: line.substring(0, lastComma),
                        score: parseInt(line.substring(lastComma + 1))
                    };
                });
            } catch (e) {
                console.error('Error loading data:', e);
                document.getElementById('playerList').innerHTML =
                    '<div class="loading" style="animation:none">데이터 로드 실패</div>';
                return;
            }
            renderStats();
        }

        function renderStats() {
            // 유저별 통계 계산
            const playerStats = {};
            allScores.forEach(score => {
                if (!playerStats[score.name]) {
                    playerStats[score.name] = {
                        name: score.name,
                        plays: 0,
                        scores: [],
                        bestScore: 0
                    };
                }
                playerStats[score.name].plays++;
                playerStats[score.name].scores.push(score.score);
                if (score.score > playerStats[score.name].bestScore) {
                    playerStats[score.name].bestScore = score.score;
                }
            });

            // 평균 점수 계산 및 정렬
            const players = Object.values(playerStats).map(p => ({
                ...p,
                avgScore: Math.round(p.scores.reduce((a, b) => a + b, 0) / p.scores.length)
            })).sort((a, b) => b.plays - a.plays);

            // 요약 통계
            document.getElementById('totalPlayers').textContent = players.length;
            document.getElementById('totalGames').textContent = allScores.length;
            document.getElementById('avgPlays').textContent = players.length > 0
                ? (allScores.length / players.length).toFixed(1)
                : '-';

            // 플레이어 리스트 렌더링
            const container = document.getElementById('playerList');

            if (players.length === 0) {
                container.innerHTML = '<div class="loading" style="animation:none">데이터가 없습니다</div>';
                return;
            }

            container.innerHTML = players.map((player, idx) => {
                const rankClass = idx === 0 ? 'top1' : idx === 1 ? 'top2' : idx === 2 ? 'top3' : '';
                return `
                    <div class="player-row">
                        <span class="rank ${rankClass}">${idx + 1}</span>
                        <span class="name">${escapeHtml(player.name)}</span>
                        <span class="plays">${player.plays}회</span>
                        <span class="best-score">${player.bestScore}점</span>
                        <span class="avg-score">${player.avgScore}점</span>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadAllData();
    </script>
</body>
</html>
